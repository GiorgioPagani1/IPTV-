name: Android TV + Phone APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RF-TV-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RF-TV-2.3.apk
      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: РФ ТВ 2.3 — тестовая версия
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          files: RF-TV-2.3.apk
          body: |
            Тестовая версия РФ ТВ 2.3 для телефона Android и Android TV.
            Скачать: RF-TV-2.3.apk (ниже в Assets).
            Проверка эфиров зависит от страны и доступных источников.
